# 示例供管理员审阅；基准脚本不安装或重载配置。
# server_name example.com; root <absolute-public-directory>;
# 证书、ACME 验证路径和安全头继承沿用现有站点。
# 双扩展名必须置于通用 .bin 规则前；HTML 永远不设 immutable。
location ~ \.wasm\.bin$ {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 在此重复或 include 站点已审核的其他安全响应头，避免 add_header 继承丢失。
}
location ~ \.(task\.bin|bin)$ {
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location ~ \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location ~ ^/releases/[^/]+/.*\.(mjs|js|css|json|mp3|woff2|svg)$ {
    types {
        text/javascript js mjs;
        text/css css;
        application/json json;
        audio/mpeg mp3;
        font/woff2 woff2;
        image/svg+xml svg;
    }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
# 上一 location 同样需要站点的完整安全头集；上线前检查每类实际响应。
# 不要覆盖已有 /.well-known/acme-challenge/ 的直达与续期规则。
