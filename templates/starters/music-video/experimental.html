<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self'"><title>三维电影起步工程</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><div class="eyebrow">Spec2Scene / Cinematic study · 01</div><h1>雪夜旷野 / 雨夜站台</h1></div><p>一道痕迹，两个空间。<br>60 秒程序化电影习作</p></header><div class="screen"><canvas width="1280" height="720" aria-label="三维样片画面"></canvas><p id="subtitle" class="scene-subtitle"></p><div id="hud" aria-live="off">正在准备画面</div><p id="render-status" role="status">正在准备三维场景…</p></div><section class="transport"><audio id="music" src="./assets/demo.wav" preload="none"></audio><button id="play" disabled>播放</button><button id="restart">重播</button><label for="timeline">时间</label><input id="timeline" type="range" min="0" max="60" step="0.01" value="0"><label for="quality">画质</label><select id="quality"><option value="auto">自动</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select><label for="startmode">开始</label><select id="startmode"><option value="auto">自动选择</option><option value="a">立即出声</option><option value="b">等画面就绪</option></select><label class="subtitle-control"><input id="subtitles" type="checkbox" checked>字幕</label><progress id="music-progress" max="100" value="0" aria-label="音乐缓冲进度"></progress><p id="status" role="status">正在载入音乐 0%</p></section><div class="notes"><p><strong>01 / 雪夜旷野</strong><br>月光留在脚印里。镜头缓缓升起，旷野逐渐吞没身影。</p><p><strong>02 / 雨夜站台</strong><br>空座、雨幕与一盏灯。焦点靠近，目光回向来处。</p><p>程序合成配乐 · 全部程序化<br>拖动时间轴查看任意时刻。</p></div></main><script defer src="./player/boot.js" data-capture="./src/main.js" data-runtime="./src/runtime.js"></script></body></html>
